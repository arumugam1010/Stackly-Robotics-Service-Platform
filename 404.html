<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - Next-Gen Robotics Service Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- 404 Section -->
    <section class="error-section" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-primary); overflow: hidden; position: relative;">
        <div class="container text-center" style="position: relative; z-index: 2;">
            <div class="robot-animation" style="margin-bottom: 40px;">
                <!-- SVG Robot will go here -->
                <svg width="250" height="250" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="robo-svg">
                    <style>
                        .robo-svg {
                            animation: hover 3s ease-in-out infinite;
                        }
                        .eye {
                            animation: scan 4s ease-in-out infinite;
                        }
                        .antenna-glow {
                            animation: pulse 2s ease-in-out infinite;
                        }
                        @keyframes hover {
                            0% { transform: translateY(0); }
                            50% { transform: translateY(-20px); }
                            100% { transform: translateY(0); }
                        }
                        @keyframes scan {
                            0%, 100% { cx: 70; }
                            50% { cx: 130; }
                        }
                        @keyframes pulse {
                            0%, 100% { opacity: 0.4; r: 8; }
                            50% { opacity: 1; r: 12; }
                        }
                    </style>
                    <!-- Antenna -->
                    <line x1="100" y1="40" x2="100" y2="10" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
                    <circle class="antenna-glow" cx="100" cy="10" r="8" fill="#22d3ee"/>
                    <circle cx="100" cy="10" r="4" fill="#fff"/>
                    
                    <!-- Head Background -->
                    <rect x="50" y="40" width="100" height="80" rx="20" fill="#1a1d2d" stroke="#22d3ee" stroke-width="2"/>
                    
                    <!-- Ears -->
                    <rect x="35" y="65" width="15" height="30" rx="5" fill="#4a5568"/>
                    <rect x="150" y="65" width="15" height="30" rx="5" fill="#4a5568"/>

                    <!-- Eye Screen -->
                    <rect x="60" y="55" width="80" height="40" rx="10" fill="#0b0d17"/>
                    
                    <!-- Glowing Eye -->
                    <circle class="eye" cx="70" cy="75" r="10" fill="#7b61ff" filter="drop-shadow(0 0 5px #7b61ff)"/>
                    
                    <!-- Mouth line -->
                    <line x1="70" y1="105" x2="130" y2="105" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- Neck -->
                    <rect x="85" y="120" width="30" height="20" fill="#4a5568"/>
                    <line x1="90" y1="125" x2="110" y2="125" stroke="#1a1d2d" stroke-width="2"/>
                    <line x1="90" y1="135" x2="110" y2="135" stroke="#1a1d2d" stroke-width="2"/>
                    
                    <!-- Body -->
                    <path d="M 40 140 Q 100 130 160 140 L 140 190 L 60 190 Z" fill="#1a1d2d" stroke="#7b61ff" stroke-width="2"/>
                    <circle cx="100" cy="165" r="15" fill="#22d3ee" opacity="0.8"/>
                    <circle cx="100" cy="165" r="8" fill="#fff"/>
                </svg>
            </div>
            <h1 style="font-size: 4rem; margin-bottom: 15px;"><span class="accent-text">404</span> - Connection Lost</h1>
            <p style="font-size: 1.2rem; color: var(--text-light); max-width: 600px; margin: 0 auto 30px auto;">
                The robotic unit you are searching for is currently unresponsive or has been reassigned. Please return to the command center.
            </p>
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-outline" style="border: 2px solid var(--color-primary); color: var(--color-primary);">Return to Home <i class="fa-solid fa-home" style="margin-left: 8px;"></i></a>
                <a href="dashboard.html" class="btn btn-primary" id="returnDashboardBtn" style="display: none;">Return to Dashboard <i class="fa-solid fa-chart-line" style="margin-left: 8px;"></i></a>
            </div>
        </div>
        
        <!-- Animated Background Elements -->
        <div class="floating-orbs" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none;">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <style>
            .orb {
                position: absolute;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0.4;
                animation: float 20s infinite ease-in-out alternate;
            }
            .orb-1 {
                width: 300px;
                height: 300px;
                background: #7b61ff;
                top: -10%;
                left: -10%;
                animation-duration: 25s;
            }
            .orb-2 {
                width: 400px;
                height: 400px;
                background: #22d3ee;
                bottom: -20%;
                right: -10%;
                animation-duration: 30s;
                animation-delay: -5s;
            }
            .orb-3 {
                width: 250px;
                height: 250px;
                background: #ff007a;
                top: 40%;
                left: 60%;
                animation-duration: 22s;
                animation-delay: -10s;
            }
            @keyframes float {
                0% { transform: translate(0, 0) scale(1); }
                33% { transform: translate(50px, -50px) scale(1.1); }
                66% { transform: translate(-30px, 40px) scale(0.9); }
                100% { transform: translate(0, 0) scale(1); }
            }
            .grid-bg-animated {
                animation: slideGrid 15s linear infinite;
            }
            @keyframes slideGrid {
                0% { background-position: 0 0; }
                100% { background-position: 40px 40px; }
            }
        </style>
        <div class="grid-bg grid-bg-animated" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(var(--border-color) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.15; z-index: 1;"></div>
    </section>

    <script src="js/auth.js"></script>
</body>
</html>
